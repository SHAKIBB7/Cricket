# Android build (Capacitor) — debug APK for testing.
#
# TAIMUR has no Android device and this project's Linux build VM
# cannot run Gradle (its Java loopback traffic is intercepted by
# the sandbox, which the Gradle daemon needs), so the debug APK
# is built in the cloud on a GitHub Ubuntu runner and uploaded
# as a workflow artifact for download.
#
# Manual trigger only (workflow_dispatch) — never runs on push,
# so it cannot disturb the main CI pipeline or burn minutes
# uninvited. A Play Store release build (signed AAB) will need
# TAIMUR's keystore + Play Console account; this workflow
# intentionally builds the unsigned-for-store DEBUG apk only.

name: Android Build (Debug APK)

on:
  workflow_dispatch:
  push:
    branches: [ audit/fix-phase2-10 ]

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Shell (static export)
        run: npm run build:shell

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cricket-scorer-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
