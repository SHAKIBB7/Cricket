name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm run test
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder-ci-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder-ci.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "placeholder-ci-project"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "placeholder-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:placeholder-ci-app-id"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "placeholder-ci-client-id.apps.googleusercontent.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-ci-anon-key"

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "placeholder-ci-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "placeholder-ci.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "placeholder-ci-project"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "placeholder-ci.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:placeholder-ci-app-id"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "placeholder-ci-client-id.apps.googleusercontent.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-ci-anon-key"
